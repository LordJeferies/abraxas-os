Canvastect.Storage=(()=>{

 const list=()=>run(['projects'],'readonly',(tx,set)=>{const r=tx.objectStore('projects').getAll();r.onsuccess=()=>set(r.result);});
 const history=id=>run(['history'],'readonly',(tx,set)=>{const r=tx.objectStore('history').index('projectId').getAll(id);r.onsuccess=()=>set(r.result.sort((a,b)=>b.at.localeCompare(a.at)));});

Canvastect.Importers=(()=>{
 const D=Canvastect.Domain;
 function text(content){const s=content.trim().replace(/^\uFEFF/,'');
  if(s.startsWith('CANVASTECT_TXT_V1\n'))return D.normalize(JSON.parse(s.slice(s.indexOf('\n')+1)));
  if(s.startsWith('{'))return D.normalize(JSON.parse(s));
  if(s.startsWith('<')){const html=new DOMParser().parseFromString(s,'text/html');for(const id of ['canvastect-data','canonicalData','app-data','editorialData','seed']){const el=html.getElementById(id);if(el)return D.normalize(JSON.parse(el.textContent));}throw Error('HTML sin JSON compatible. No se ejecutan scripts importados.');}

  const doc=D.empty('Proyecto TXT');doc.sourcePayload={text:content};let f=null,b=null;const unparsed=[];
  for(const line of s.split(/\r?\n/)){let m;
   if((m=line.match(/^PROYECTO:\s*(.*)$/i))){doc.title=m[1];continue;}
   if((m=line.match(/^===\s*FICHA:\s*(.*?)\s*===$/i))){f=D.newFicha();f.title=m[1];doc.fichas.push(f);b=null;continue;}
   if(!f){if(line.trim())unparsed.push(line);continue;}
   if((m=line.match(/^TIPO:\s*(\w+)/i))){f.type=m[1];continue;}
   if((m=line.match(/^(HOOK|CUERPO|CTA):\s*(.*)$/i))){f.copy[{HOOK:'hook',CUERPO:'body',CTA:'cta'}[m[1].toUpperCase()]]=m[2];b=null;continue;}
   if((m=line.match(/^\[(T[1-9]):\s*(.*?)\]\s*\((\d+(?:\.\d+)?)s?\s*-\s*(\d+(?:\.\d+)?)s?\)$/i))){b=D.block({laneId:m[1].toUpperCase(),label:m[2],start:Number(m[3]),end:Number(m[4]),kind:D.kinds[m[1].toUpperCase()]});f.blocks.push(b);continue;}
   if(b&&(m=line.match(/^(GUION|PROMPT|INSTRUCCION):\s*(.*)$/i))){if(m[1].toUpperCase()==='PROMPT')b.prompts={noText:m[2]};else b[m[1].toUpperCase()==='GUION'?'text':'instructions']=m[2];continue;}

})();

 function shell(S){const doc=S.doc,f=doc?.fichas.find(f=>f.id===S.fid);return `<header class="topbar">${btn('sidebar',icon('menu'),'iconbtn','aria-label="Abrir biblioteca"')}<div class="brand"><b>Λ</b><span>Canvastect<small>ABRXS · EDITORIAL WORKSPACE</small></span></div><div class="projectname">${esc(doc?.title||'Abrxs - Canvastect')}<small id="save-state">${esc(S.saveState||'Tu espacio de producción')}</small></div><div class="topactions">${btn('projects',icon('folder')+' Proyectos')}${btn('import','Importar')}${btn('export',icon('export')+' Exportar','primary')}</div></header>
 <nav class="nav">${[['timeline','timeline','Visor'],['calendar','calendar','Calendario'],['board','folder','Producción'],['history','history','Historial']].map(([v,i,l])=>btn('view',icon(i)+'<span>'+l+'</span>',S.view===v?'active':'',`data-view="${v}"`)).join('')}<span class="version">0.1 · Núcleo funcional</span></nav>
 <div class="workspace ${S.sidebar?'show-library':''}"><aside class="library"><div class="section-title">CONTENIDOS ${btn('new-ficha',icon('plus'),'iconbtn','aria-label="Crear ficha"')}</div><input id="search" placeholder="Buscar una ficha…" value="${esc(S.search)}" aria-label="Buscar fichas"><div class="library-list">${(doc?.fichas||[]).filter(x=>(x.title+' '+x.type).toLowerCase().includes((S.search||'').toLowerCase())).map(x=>`<button class="piece ${x.id===S.fid?'selected':''}" data-ficha="${esc(x.id)}"><span class="piece-type">${esc(x.type)} <i>${esc(x.maturity||'beta')}</i></span><strong>${esc(x.title)}</strong><small>${D.isVideo(x)?x.blocks.length+' elementos':x.items.length+' láminas/secciones'} · ${D.missing(x).length?'Por completar':'Estructura completa'}</small></button>`).join('')||'<p class="muted">Importa un proyecto o crea tu primera ficha.</p>'}</div><footer>${doc?doc.fichas.length+' fichas · '+doc.fichas.reduce((n,f)=>n+f.blocks.length,0)+' elementos':'Sin proyecto activo'}</footer></aside>
 <section class="content">${!doc?welcome():!f&&S.view!=='history'?`<div class="empty"><h1>${esc(doc.title)}</h1><p>Este proyecto está vacío. Crea una ficha o importa contenido.</p>${btn('new-ficha','Crear primera ficha','primary')}</div>`:S.view==='timeline'?editor(S,f):S.view==='calendar'?calendar(S):S.view==='board'?board(S):'<div id="history-view" class="page"><h1>Historial</h1><p>Cargando revisiones guardadas…</p></div>'}</section></div>`;}
 function welcome(){return `<div class="welcome"><div class="eyebrow">ABRXS — CANVASTECT</div><h1>El guion.<br>Sus recursos.<br><em>Todo en el tiempo.</em></h1><p>Abre una ficha de producción y descubre qué se dice, qué se ve y cómo crear cada elemento. Trabaja aquí; llévate un lienzo completo.</p><div class="actions">${btn('import','Abrir HTML / TXT / JSON','primary')}${btn('new-project','Crear proyecto')}</div><div class="welcome-cards"><article><span>01 / COMPRENDER</span><h3>Nueve pistas, una historia.</h3><p>Relaciona guion, XR, imágenes, motion y sonido.</p></article><article><span>02 / PRODUCIR</span><h3>Del bloque a sus instrucciones.</h3><p>Consulta recursos, cambia tiempos y completa la ficha.</p></article><article><span>03 / CONSERVAR</span><h3>Un lienzo que sigue contigo.</h3><p>Exporta HTML o TXT, reimporta y conserva revisiones.</p></article></div><small>Los archivos se procesan en este navegador. No se envían a un servidor.</small></div>`;}
 function editor(S,f){const ev=D.visibleEvents(f,S.route),b=ev.find(x=>x.id===S.bid),t=D.duration(f,S.route),story=ev.filter(e=>e.laneId==='story'),narrative=story.length?story:ev.filter(e=>['T1','T6'].includes(e.laneId));return `<div class="ficha-head"><div><div class="eyebrow">${esc(f.type)} / ${esc(f.maturity)} <span class="tag">${D.missing(f).length} pendientes</span></div><h1>${esc(f.title)}</h1></div><div class="actions">${btn('edit-ficha','Editar ficha')}${D.isVideo(f)?`<select id="route" aria-label="Ruta">${D.routes(f).map(r=>`<option ${r===S.route?'selected':''}>${esc(r)}</option>`).join('')}</select>`:''}</div></div>
 <div class="editor-grid ${S.bid?'has-inspector':''}"><div class="editor-main">${D.isVideo(f)?`<div class="upper"><section class="story"><div class="section-title">GUION · ${esc(S.route)} <span>${narrative.length} partes</span></div><div class="transcript">${narrative.map(x=>`<button class="sentence ${x.id===S.bid||x.partId&&x.partId===b?.partId?'linked':''}" data-block="${esc(x.id)}"><small>${fmt(x.start)} <b>${esc(x.speaker||x.role||'Guion')}</b></small><p>${esc(x.displayText||x.text||x.spokenText||x.label)}</p></button>`).join('')||'<p class="muted">Sin guion todavía. Añade un A-roll o VO.</p>'}</div></section><section class="scene"><div class="section-title">MOMENTO ACTUAL ${btn('master','Abrir máster','subtle')}</div><div class="scene-preview">${b?.imageData?`<img src="${esc(b.imageData)}" alt="Referencia del elemento">`:`<div class="scene-placeholder"><span>${icon('timeline')}</span><strong>${b?esc(b.label):'Selecciona un elemento'}</strong><p>${b?esc(b.description||b.function||b.instructions||'Consulta sus instrucciones en el inspector.'):'El visor funciona aunque todavía no exista el video.'}</p></div>`}</div><div id="now-active" class="active-list">${D.active(f,S.route,S.time).filter(x=>x.laneId!=='story').slice(0,10).map(x=>`<button data-block="${esc(x.id)}">${esc(x.laneId)} · ${esc(x.label)}</button>`).join('')}</div></section></div><div class="timeline-tools"><div class="actions">${btn('play',S.playing?'Pausa':icon('play'),'iconbtn','aria-label="Reproducir tiempo conceptual"')}<span id="clock">${fmt(S.time)}</span><small>/ ${fmt(t)}</small></div><div class="actions">${btn('add-block','+ Objeto')}${btn('undo','↶','iconbtn','aria-label="Deshacer"')}${btn('redo','↷','iconbtn','aria-label="Rehacer"')}${btn('zoom-out','−','iconbtn','aria-label="Alejar"')}${btn('zoom-in','+','iconbtn','aria-label="Acercar"')}${btn('fit','Ajustar')}<select id="snap" aria-label="Ajuste temporal"><option value="0" ${!S.snap?'selected':''}>Libre</option><option value="0.1" ${S.snap===.1?'selected':''}>0.1 s</option><option value="1" ${S.snap===1?'selected':''}>1 s</option></select></div></div><div id="timeline-scroll" class="timeline-scroll">${timeline(S,f)}</div><div class="hint">Arrastra el cuerpo para mover · bordes para duración · selecciona para consultar · cambios al terminar el gesto</div>`:staticView(S,f)}</div><aside class="inspector">${inspector(S,f,b)}</aside></div>`;}
 function timeline(S,f){const es=D.visibleEvents(f,S.route);const dur=Math.max(D.duration(f,S.route),...es.map(e=>e.end));const px=S.px||Math.max(.02,Math.min(80,((S.viewport||800)-116)/dur));const width=Math.max(S.viewport||800,dur*px+116);let step=1;while(step*px<70)step=step<5?step+1:step*2;let ticks='';for(let n=0;n<=dur;n+=step)ticks+=`<span style="left:${116+n*px}px">${fmt(n).replace(/\.000$/,'')}</span>`;
 return `<div class="timeline" style="width:${width}px" data-px="${px}"><div class="ruler" data-ruler="1">${ticks}</div><div id="playhead" style="left:${116+S.time*px}px"></div>${[...D.tracks].reverse().concat([['story','PARTES','#c6a6b3']]).filter(([lane])=>lane!=='story'||es.some(e=>e.laneId==='story')).map(([lane,label,color])=>`<div class="lane"><div class="lane-label" style="--track:${color}"><b>${lane==='story'?'§':lane}</b>${label}</div><div class="track-area">${es.filter(b=>b.laneId===lane).map(b=>`<div tabindex="0" role="button" aria-label="${esc(b.label)} ${fmt(b.start)} a ${fmt(b.end)}" data-block="${esc(b.id)}" class="block ${b.id===S.bid?'selected':''} ${b.parentId===S.bid?'child-linked':''}" style="--track:${color};left:${116+b.start*px}px;width:${Math.max(1,(b.end-b.start)*px)}px" title="${esc(b.label)} · ${fmt(b.start)} → ${fmt(b.end)}"><i data-edge="left"></i><span>${esc(b.label)}</span><i data-edge="right"></i></div>`).join('')}</div></div>`).join('')}</div>`;
 }
 function inspector(S,f,b){if(!D.isVideo(f))return `<div class="section-title">CONTENIDO ESTÁTICO</div><p>Edita cada lámina o sección. Su orden forma parte del proyecto.</p><details><summary>Datos completos de la ficha</summary><pre>${esc(JSON.stringify(f,null,2))}</pre></details>`;if(!b)return `<div class="inspector-empty">${icon('timeline')}<h2>Todo empieza con un elemento.</h2><p>Selecciona una parte del guion, un XR o un recurso para abrir su ficha de producción.</p></div>`;
 const linked=D.visibleEvents(f,S.route).filter(c=>c.id!==b.id&&(c.parentId===b.id||b.parentId&&c.id===b.parentId||b.partId&&c.partId===b.partId));
 return `<div class="section-title">${esc(b.laneId)} / INSPECTOR ${btn('close-inspector','×','iconbtn','aria-label="Cerrar inspector"')}</div><form id="block-form">${field('Título','label',b.label)}<div class="two">${field('Inicio (s)','start',b.start,false,'number')}${field('Final (s)','end',b.end,false,'number')}</div><small>Duración ${fmt(b.end-b.start)} · Ruta ${esc(S.route)}</small>${field('Guion / texto','text',b.displayText||b.text||b.spokenText||'',true)}${field('Descripción','description',b.description||b.function||'',true)}${field('Instrucciones','instructions',b.instructions||'',true)}${field('Prompt','prompt',b.prompts?.noText||b.asset?.promptNoText||'',true)}<label>Estado<select name="status">${['ghost','planned','ready','materialized','approved'].map(s=>`<option ${b.status===s?'selected':''}>${s}</option>`).join('')}</select></label><button class="primary" type="submit">Guardar elemento</button></form><div class="actions wrap">${btn('copy-block','Copiar ficha')}${btn('image','Vincular imagen')}${b.laneId==='T2'?btn('add-child','+ Imagen del XR'):''}${btn('delete-block','Eliminar','danger')}</div><details open><summary>Relaciones · ${linked.length}</summary>${linked.map(x=>`<button class="related" data-block="${esc(x.id)}">${esc(x.laneId)} · ${esc(x.label)}</button>`).join('')||'<p class="muted">Sin vínculos explícitos.</p>'}</details><details><summary>Todos los datos / recursos originales</summary><pre>${esc(JSON.stringify(b,null,2))}</pre></details>`;
 }
 function staticView(S,f){return `<div class="static-list"><div class="actions">${btn('add-item','+ Lámina / sección')}</div>${f.items.map((x,i)=>`<article class="static-card"><div class="section-title">${i+1} / ${esc(x.title)}<span>${btn('item-up','↑','iconbtn',`data-id="${esc(x.id)}" aria-label="Mover arriba"`)}${btn('item-down','↓','iconbtn',`data-id="${esc(x.id)}" aria-label="Mover abajo"`)}</span></div>${x.imageData?`<img src="${esc(x.imageData)}" alt="Referencia">`:''}<h2>${esc(x.title)}</h2><p>${esc(x.text)}</p><div class="actions">${btn('edit-item','Editar','',`data-id="${esc(x.id)}"`)}${btn('copy-item','Copiar','',`data-id="${esc(x.id)}"`)}${btn('delete-item','Eliminar','danger',`data-id="${esc(x.id)}"`)}</div><details><summary>Prompt y datos completos</summary><pre>${esc(JSON.stringify(x,null,2))}</pre></details></article>`).join('')}</div>`;}
 function calendar(S){const date=new Date(S.month+'-01T12:00:00'),y=date.getFullYear(),m=date.getMonth(),offset=(date.getDay()+6)%7;const start=new Date(y,m,1-offset,12);const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return `<div class="page"><div class="pagehead"><div class="eyebrow">PLANIFICACIÓN</div><h1>Calendario editorial</h1><p>La fecha de publicación es independiente del tiempo del video.</p><div class="actions">${btn('prev-month','←') }<strong>${date.toLocaleDateString('es',{month:'long',year:'numeric'})}</strong>${btn('next-month','→')}</div></div><div class="calendar-grid">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>'<div class="weekday">'+x+'</div>').join('')}${Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const day=ds(d);return `<div class="day ${d.getMonth()!==m?'other':''}" data-date="${day}"><b>${d.getDate()}</b>${S.doc.fichas.filter(f=>f.scheduledDate===day).map(f=>`<button draggable="true" data-scheduled="${esc(f.id)}" data-ficha="${esc(f.id)}">${esc(f.title)}</button>`).join('')}</div>`;}).join('')}</div><h2>Sin programar</h2><div class="unscheduled">${S.doc.fichas.filter(f=>!f.scheduledDate).map(f=>`<button draggable="true" data-scheduled="${esc(f.id)}" data-ficha="${esc(f.id)}">${esc(f.title)}</button>`).join('')}</div><p class="muted">Arrastra para programar en escritorio. En móvil, abre la ficha y cambia su fecha desde Editar ficha.</p></div>`;}
 function board(S){return `<div class="page"><h1>Producción</h1><p>Madurez beta/alfa y estado de producción se gestionan por separado.</p><div class="board">${[['draft','Borrador'],['in_production','En producción'],['ready_for_review','Revisión'],['confirmed_publish','Confirmado'],['published','Publicado']].map(([s,l])=>`<section><h3>${l}</h3>${S.doc.fichas.filter(f=>f.status===s).map(f=>`<button class="board-card" data-ficha="${esc(f.id)}"><small>${esc(f.type)} · ${esc(f.maturity)}</small><strong>${esc(f.title)}</strong><span>${esc(D.missing(f).join(' · ')||'Sin faltantes básicos')}</span></button>`).join('')}</section>`).join('')}</div></div>`;}
 return {esc,fmt,btn,field,shell,timeline,icon};
})();

(async()=>{
 'use strict';
 const D=Canvastect.Domain,V=Canvastect.Views,DB=Canvastect.Storage,E=Canvastect.Exporters;
 const $=s=>document.querySelector(s),modal=$('#modal');
 const S={doc:null,fid:null,bid:null,route:'source',view:'timeline',search:'',time:0,px:null,viewport:800,snap:0,playing:false,sidebar:false,month:new Date().toISOString().slice(0,7),saveState:'',undo:[],redo:[],busy:false,formDirty:false};
 const toast=t=>{$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(S.toast);S.toast=setTimeout(()=>$('#toast').classList.remove('show'),4200);};
 const f=()=>S.doc?.fichas.find(x=>x.id===S.fid);
 const b=()=>f()?.blocks.find(x=>x.id===S.bid);
 const close=()=>modal.close();
 const show=html=>{modal.innerHTML=V.btn('close','×','modal-close','aria-label="Cerrar diálogo"')+html;if(!modal.open)modal.showModal();};
 const safe=fn=>async(...a)=>{try{await fn(...a);}catch(e){console.error(e);toast(e.message||String(e));}};
 function selectFicha(id){S.fid=id;S.bid=null;S.px=null;S.time=0;S.route=D.routes(f())[0]||'source';S.sidebar=false;S.view='timeline';S.formDirty=false;render();}
 function ensure(){if(!S.doc)return;if(!f())S.fid=S.doc.fichas[0]?.id||null;if(f()&&!D.routes(f()).includes(S.route))S.route='source';if(!b())S.bid=null;}
 function render(){ensure();const scroll=$('#timeline-scroll');const sx=scroll?.scrollLeft||0;$('#app').innerHTML=V.shell(S);const el=$('#timeline-scroll');if(el){S.viewport=el.clientWidth;el.innerHTML=V.timeline(S,f());el.scrollLeft=sx;}if(S.view==='history'&&S.doc)loadHistory();}
 async function commit(reason,fn){if(S.busy)throw Error('Espera a que termine el guardado.');if(!S.doc)throw Error('Crea o importa un proyecto primero.');S.busy=true;try{const prev=D.clone(S.doc),next=D.clone(S.doc);fn(next);D.validate(next);D.touch(next);await DB.save(next,prev,reason);S.undo.push(prev);if(S.undo.length>15)S.undo.shift();S.redo=[];S.doc=next;S.saveState='Guardado local · '+new Date().toLocaleTimeString();S.formDirty=false;render();}finally{S.busy=false;}}
 async function adopt(doc,why='Importación'){D.validate(doc);const previous=await DB.get(doc.projectId);if(previous&&JSON.stringify(previous)!==JSON.stringify(doc))D.touch(doc);await DB.save(doc,previous,why);S.doc=doc;S.fid=doc.fichas[0]?.id;S.bid=null;S.route='source';S.undo=[];S.redo=[];S.saveState='Guardado en este dispositivo';S.formDirty=false;try{localStorage.setItem('canvastect-last',doc.projectId);}catch{}render();}
 function pick(accept,cb){const input=$('#file-input');input.accept=accept;input.value='';input.onchange=safe(async()=>{if(input.files[0])await cb(input.files[0]);});input.click();}
 async function importFile(file){if(file.size>80*1024*1024)throw Error('Límite de entrada: 80 MB.');const doc=Canvastect.Importers.text(await file.text());const same=await DB.get(doc.projectId);show(`<h2>Revisar importación</h2><p>${V.esc(doc.title)}</p><div class="metric-row"><b>${doc.fichas.length} fichas</b><b>${doc.fichas.reduce((n,f)=>n+f.blocks.length,0)} elementos</b></div><p>${V.esc((doc.importWarnings||[]).join('\n'))}</p><p>${same?'Este ID ya existe. La actualización conserva una copia anterior en Historial. En esta versión se reemplaza el documento completo; no se fusionan campos automáticamente.':'Se creará un proyecto independiente.'}</p><div class="actions">${V.btn('accept-import',same?'Actualizar y conservar anterior':'Importar proyecto','primary')}${V.btn('import-copy','Crear copia independiente')}</div>`);S.pendingImport=doc;}
 async function saveBlock(){const form=$('#block-form');if(!form||!b())return;const data=Object.fromEntries(new FormData(form));const fid=S.fid,bid=S.bid,r=S.route;await commit('Editar elemento',doc=>{const ff=doc.fichas.find(x=>x.id===fid);D.setTimes(ff,bid,r,Number(data.start),Number(data.end));const bb=ff.blocks.find(x=>x.id===bid);bb.label=data.label;bb.description=data.description;bb.instructions=data.instructions;bb.status=data.status;bb.displayText=data.text;bb.text=data.text;bb.prompts={...bb.prompts,noText:data.prompt};});}
 async function flush(){if(S.formDirty)await saveBlock();}
 async function loadHistory(){const id=S.doc.projectId;try{const rows=await DB.history(id);if(S.doc.projectId!==id||S.view!=='history')return;S.history=rows;$('#history-view').innerHTML=`<div class="eyebrow">VERSIONES DE ESTE DISPOSITIVO</div><h1>Tu trabajo tiene memoria.</h1><p>Exportar una versión anterior no cambia la actual. Restaurar crea una nueva revisión.</p><div class="history-row"><div><b>Versión actual</b><p>${V.esc(S.doc.updatedAt)}</p></div>${V.btn('export-html','HTML')}${V.btn('export-txt','TXT')}</div>${rows.map((h,i)=>`<div class="history-row"><div><b>${V.esc(h.reason)}</b><p>${V.esc(new Date(h.at).toLocaleString())} · ${h.document.fichas.length} fichas</p></div>${V.btn('history-html','HTML','',`data-index="${i}"`)}${V.btn('history-txt','TXT','',`data-index="${i}"`)}${V.btn('history-view','Ver datos','',`data-index="${i}"`)}${V.btn('restore','Restaurar','',`data-index="${i}"`)}</div>`).join('')||'<p>No hay revisiones anteriores todavía.</p>'}<p class="muted">Historial local en IndexedDB. Exporta respaldos: borrar los datos del navegador también elimina estas revisiones. No se purgan automáticamente.</p>`;}catch(e){toast(e.message);}}
 async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copiado');}catch{show('<h2>Texto para copiar</h2><textarea rows="15" readonly>'+V.esc(text)+'</textarea>');}}
 function editFicha(){const ff=f();show(`<h2>Ficha editorial</h2><form id="ficha-form">${V.field('Título','title',ff.title)}${V.field('Hook','hook',ff.copy?.hook||'',true)}${V.field('Desarrollo','body',ff.copy?.body||ff.copy?.fullCopy||'',true)}${V.field('CTA','cta',ff.copy?.cta||'',true)}${V.field('Fecha de publicación','date',ff.scheduledDate||'',false,'date')}<div class="two"><label>Madurez<select name="maturity"><option ${ff.maturity==='beta'?'selected':''}>beta</option><option ${ff.maturity==='alfa'?'selected':''}>alfa</option></select></label><label>Producción<select name="status">${['draft','in_production','ready_for_review','confirmed_publish','published'].map(x=>`<option ${ff.status===x?'selected':''}>${x}</option>`).join('')}</select></label></div>${V.field('Notas','note',ff.note||'',true)}<p class="muted">${V.esc(D.missing(ff).join(' · '))}. Marcar alfa es una decisión editorial; no genera ni verifica los recursos automáticamente.</p><button class="primary">Guardar ficha</button></form>`);}
 function addBlock(parentId=null){show(`<h2>${parentId?'Imagen dentro del XR':'Nuevo elemento'}</h2><form id="add-form" data-parent="${V.esc(parentId||'')}"><label>Tipo<select name="lane">${(parentId?D.tracks.filter(t=>t[0]==='T3'):D.tracks).map(([v,l])=>`<option value="${v}">${v} · ${l}</option>`).join('')}</select></label>${V.field('Nombre','label','Nuevo elemento')}<div class="two">${V.field('Inicio','start',parentId?D.timing(b(),S.route).start:S.time,false,'number')}${V.field('Duración (s)','duration',parentId?D.timing(b(),S.route).end-D.timing(b(),S.route).start:2,false,'number')}</div><button class="primary">Crear y abrir inspector</button></form>`);}
 async function exportNow(format){await flush();await E.exportDoc(S.doc,format);toast('Exportación preparada con el documento actual');}
 document.addEventListener('click',safe(async ev=>{
  const piece=ev.target.closest('[data-ficha]');if(piece){await flush();selectFicha(piece.dataset.ficha);return;}
  const el=ev.target.closest('[data-block]');if(el&&!S.preventClick){await flush();S.bid=el.dataset.block;const bb=D.visibleEvents(f(),S.route).find(x=>x.id===S.bid);if(bb)S.time=bb.start;render();return;}
  const button=ev.target.closest('[data-action]');if(!button)return;const a=button.dataset.action;
  if(a==='close'){close();return;}if(a==='sidebar'){S.sidebar=!S.sidebar;$('#app .workspace').classList.toggle('show-library',S.sidebar);return;}
  if(a==='import'){await flush();pick('.html,.txt,.json',importFile);return;}
  if(a==='new-project'){show('<h2>Nuevo proyecto</h2><form id="project-form">'+V.field('Nombre','title','Mi proyecto')+'<button class="primary">Crear</button></form>');return;}
  if(a==='projects'){await flush();const docs=await DB.list();S.projects=docs;show('<h2>Proyectos de este dispositivo</h2>'+docs.map((x,i)=>V.btn('open-project',V.esc(x.title),'project-option',`data-index="${i}"`)).join('')+V.btn('new-project','+ Nuevo proyecto','primary'));return;}
  if(a==='open-project'){close();await adopt(S.projects[Number(button.dataset.index)],'Abrir proyecto');return;}
  if(a==='accept-import'||a==='import-copy'){const doc=S.pendingImport;if(a==='import-copy'){doc.projectId=D.id();doc.revisionId=D.id();}await adopt(doc,'Antes de importar actualización');close();toast('Importación completa');return;}
  if(a==='new-ficha'){if(!S.doc)await adopt(D.empty());show(`<h2>Nueva ficha</h2><form id="new-ficha-form">${V.field('Título','title','Mi contenido')}<label>Formato<select name="type">${['intro','vertical','horizontal','carousel','thread','note','quote','pdf','full_episode'].map(x=>'<option>'+x+'</option>').join('')}</select></label><button class="primary">Crear ficha</button></form>`);return;}
  if(!S.doc)throw Error('Importa o crea un proyecto primero.');
  if(a==='view'){await flush();S.view=button.dataset.view;S.playing=false;render();return;}
  if(a==='export'){await flush();show(`<h2>Tu lienzo, completo.</h2><p>Se exportan ${S.doc.fichas.length} fichas con el estado actual. El HTML incluye este mismo editor y puede abrirse sin servidor.</p><div class="actions">${V.btn('export-html','Descargar lienzo HTML','primary')}${V.btn('export-txt','Descargar TXT completo')}${V.btn('export-source','Fuente original')}</div><p class="muted">El TXT contiene JSON íntegro con encabezado. No se publica nada en GitHub al descargar. El máster de video abierto para consulta no se incluye.</p>`);return;}
  if(a==='export-html'||a==='export-txt'){await exportNow(a==='export-html'?'html':'txt');return;}
  if(a==='export-source'){await E.download('fuente_original.json',JSON.stringify(S.doc.sourcePayload||{},null,2));return;}
  if(a==='edit-ficha'){await flush();editFicha();return;}
  if(a==='close-inspector'){await flush();S.bid=null;render();return;}
  if(a==='add-block'||a==='add-child'){await flush();addBlock(a==='add-child'?S.bid:null);return;}
  if(a==='delete-block'){const target=b();const n=f().blocks.filter(x=>x.parentId===S.bid).length;show(`<h2>Eliminar ${V.esc(target.label)}</h2><p>Se eliminará el elemento y sus descendientes (${n} hijos directos). La versión anterior quedará en Historial.</p>${V.btn('confirm-delete','Eliminar','danger')}`);return;}
  if(a==='confirm-delete'){const bid=S.bid;await commit('Eliminar elemento y descendientes',doc=>{const ff=doc.fichas.find(x=>x.id===S.fid),ids=new Set([bid]);let again=true;while(again){again=false;for(const x of ff.blocks)if(ids.has(x.parentId)&&!ids.has(x.id)){ids.add(x.id);again=true;}}ff.blocks=ff.blocks.filter(x=>!ids.has(x.id));});S.bid=null;close();render();return;}
  if(a==='copy-block'){await flush();await copy(JSON.stringify(b(),null,2));return;}
  if(a==='image'){await flush();pick('image/png,image/jpeg,image/webp',async file=>{if(file.size>8*1024*1024)throw Error('Máximo 8 MB por imagen en esta versión.');if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Usa PNG/JPEG/WebP');const data=await new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});await commit('Vincular imagen',doc=>{doc.fichas.find(x=>x.id===S.fid).blocks.find(x=>x.id===S.bid).imageData=data;});});return;}
  if(a==='master'){pick('video/*',file=>{if(S.masterUrl)URL.revokeObjectURL(S.masterUrl);S.masterUrl=URL.createObjectURL(file);show('<h2>Máster · consulta de fuente</h2><video controls style="width:100%;max-height:65vh" src="'+V.esc(S.masterUrl)+'"></video><p>Archivo de sesión. Consulta libre; no hay sincronización automática montaje/fuente en esta versión.</p>');});return;}
  if(a==='fit'||a.startsWith('zoom-')){await flush();const px=Number($('.timeline')?.dataset.px)||20;S.px=a==='fit'?null:a==='zoom-in'?Math.min(400,px*1.6):Math.max(.01,px/1.6);render();return;}
  if(a==='play'){S.playing=!S.playing;render();return;}
  if(a==='undo'||a==='redo'){await flush();const stack=a==='undo'?S.undo:S.redo;if(!stack.length){toast('No hay operaciones');return;}const prev=S.doc,next=D.clone(stack.pop());(a==='undo'?S.redo:S.undo).push(D.clone(prev));D.touch(next);await DB.save(next,prev,a==='undo'?'Deshacer':'Rehacer');S.doc=next;render();return;}
  if(a==='prev-month'||a==='next-month'){const d=new Date(S.month+'-01T12:00:00');d.setMonth(d.getMonth()+(a==='next-month'?1:-1));S.month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render();return;}
  if(a.startsWith('history-')){const h=S.history[Number(button.dataset.index)];if(a==='history-view')show('<h2>'+V.esc(h.reason)+'</h2><pre>'+V.esc(JSON.stringify(h.document,null,2))+'</pre>');else await E.exportDoc(h.document,a==='history-html'?'html':'txt');return;}
  if(a==='restore'){S.restore=S.history[Number(button.dataset.index)].document;show('<h2>Restaurar como nueva revisión</h2><p>La versión actual se conservará antes de restaurar.</p>'+V.btn('confirm-restore','Restaurar','primary'));return;}
  if(a==='confirm-restore'){const next=D.clone(S.restore);D.touch(next);await DB.save(next,S.doc,'Antes de restaurar');S.doc=next;S.undo=[];S.redo=[];close();render();return;}
  if(a==='add-item'||a==='edit-item'){const x=a==='add-item'?{id:D.id(),title:'Nueva lámina',text:'',prompt:''}:f().items.find(x=>x.id===button.dataset.id);show(`<h2>Lámina / sección</h2><form id="item-form" data-id="${V.esc(x.id)}">${V.field('Título','title',x.title)}${V.field('Texto','text',x.text,true)}${V.field('Prompt visual','prompt',x.prompt,true)}<button class="primary">Guardar</button></form>`);return;}
  if(a==='copy-item'){await copy(JSON.stringify(f().items.find(x=>x.id===button.dataset.id),null,2));return;}
  if(['item-up','item-down','delete-item'].includes(a)){await commit('Editar orden de contenido',doc=>{const ff=doc.fichas.find(x=>x.id===S.fid),i=ff.items.findIndex(x=>x.id===button.dataset.id);if(a==='delete-item')ff.items.splice(i,1);else{const j=i+(a==='item-up'?-1:1);if(j>=0&&j<ff.items.length)[ff.items[i],ff.items[j]]=[ff.items[j],ff.items[i]];}});return;}
 }));
 document.addEventListener('submit',safe(async ev=>{ev.preventDefault();const form=ev.target,data=Object.fromEntries(new FormData(form));
  if(form.id==='block-form'){await saveBlock();toast('Elemento guardado');return;}
  if(form.id==='project-form'){await adopt(D.empty(data.title));close();return;}
  if(form.id==='new-ficha-form'){const n=D.newFicha(data.type);n.title=data.title;await commit('Crear ficha',doc=>doc.fichas.push(n));close();selectFicha(n.id);return;}
  if(form.id==='ficha-form'){await commit('Editar ficha',doc=>{const ff=doc.fichas.find(x=>x.id===S.fid);ff.title=data.title;ff.copy={...ff.copy,hook:data.hook,body:data.body,cta:data.cta,fullCopy:[data.hook,data.body,data.cta].filter(Boolean).join('\n\n')};ff.scheduledDate=data.date;ff.status=data.status;ff.maturity=data.maturity;ff.note=data.note;});close();return;}
  if(form.id==='add-form'){const start=Number(data.start),end=start+Number(data.duration),bid=D.id(),parent=form.dataset.parent||null;if(end<=start)throw Error('La duración debe ser positiva');await commit('Añadir elemento',doc=>{const ff=doc.fichas.find(x=>x.id===S.fid);ff.blocks.push(D.block({id:bid,laneId:data.lane,kind:D.kinds[data.lane],label:data.label,start,end,routes:[S.route],parentId:parent,status:'planned'}));});S.bid=bid;close();render();return;}
  if(form.id==='item-form'){await commit('Editar lámina',doc=>{const ff=doc.fichas.find(x=>x.id===S.fid),i=ff.items.findIndex(x=>x.id===form.dataset.id),x={...(ff.items[i]||{}),...data,id:form.dataset.id};if(i<0)ff.items.push(x);else ff.items[i]=x;});close();return;}
 }));
 document.addEventListener('input',ev=>{if(ev.target.closest('#block-form'))S.formDirty=true;if(ev.target.id==='search'){S.search=ev.target.value;const query=S.search.toLowerCase();document.querySelectorAll('.piece').forEach(el=>{el.hidden=!el.textContent.toLowerCase().includes(query);});}});
 document.addEventListener('change',safe(async ev=>{if(ev.target.id==='route'){await flush();S.route=ev.target.value;S.bid=null;S.time=0;S.px=null;render();}if(ev.target.id==='snap')S.snap=Number(ev.target.value);}));
 let drag=null;
 document.addEventListener('pointerdown',ev=>{
  const block=ev.target.closest('.block');if(!block){const ruler=ev.target.closest('[data-ruler]');if(ruler){const rect=ruler.getBoundingClientRect(),px=Number($('.timeline').dataset.px);S.time=Math.max(0,Math.min(D.duration(f(),S.route),(ev.clientX-rect.left-116)/px));updateClock();}return;}
  if(ev.button!==0||S.formDirty)return;
  if(ev.pointerType==='touch'&&S.bid!==block.dataset.block){S.bid=block.dataset.block;render();return;}
  const bb=D.visibleEvents(f(),S.route).find(x=>x.id===block.dataset.block);if(!bb)return;
  block.setPointerCapture(ev.pointerId);drag={id:bb.id,start:bb.start,end:bb.end,x:ev.clientX,px:Number($('.timeline').dataset.px),edge:ev.target.dataset.edge||'move',el:block,pointerId:ev.pointerId,changed:false};
 });
 document.addEventListener('pointermove',ev=>{if(!drag||ev.pointerId!==drag.pointerId)return;let delta=(ev.clientX-drag.x)/drag.px;if(S.snap)delta=Math.round(delta/S.snap)*S.snap;let start=drag.start,end=drag.end;if(drag.edge==='move'){start=Math.max(0,start+delta);end=start+drag.end-drag.start;}else if(drag.edge==='left')start=Math.max(0,Math.min(end-.001,start+delta));else end=Math.max(start+.001,end+delta);drag.next={start,end};drag.changed=Math.abs(ev.clientX-drag.x)>3;drag.el.style.left=116+start*drag.px+'px';drag.el.style.width=Math.max(1,(end-start)*drag.px)+'px';$('#clock').textContent=V.fmt(start)+' → '+V.fmt(end);});
 document.addEventListener('pointerup',safe(async ev=>{if(!drag||ev.pointerId!==drag.pointerId)return;const x=drag;drag=null;if(x.changed){S.preventClick=true;setTimeout(()=>S.preventClick=false,250);try{await commit('Mover / redimensionar elemento',doc=>D.setTimes(doc.fichas.find(f=>f.id===S.fid),x.id,S.route,x.next.start,x.next.end));S.bid=x.id;render();}catch(e){render();throw e;}}}));
 document.addEventListener('pointercancel',()=>{if(drag){drag=null;render();}});
 document.addEventListener('keydown',safe(async ev=>{if(ev.key==='Escape'&&drag){drag=null;render();}if(ev.target.matches('input,textarea,select')||ev.target.isContentEditable)return;if(ev.key==='Enter'&&ev.target.dataset.block){S.bid=ev.target.dataset.block;render();}if(S.view==='timeline'&&f()&&['ArrowLeft','ArrowRight'].includes(ev.key)){ev.preventDefault();S.time=Math.max(0,Math.min(D.duration(f(),S.route),S.time+(ev.key==='ArrowRight'?1:-1)));updateClock();}if(ev.key===' '&&S.view==='timeline'&&f()){ev.preventDefault();S.playing=!S.playing;render();}}));
 document.addEventListener('dragstart',ev=>{const x=ev.target.closest('[data-scheduled]');if(x)ev.dataTransfer.setData('text/plain',x.dataset.scheduled);});
 document.addEventListener('dragover',ev=>{if(ev.target.closest('[data-date]'))ev.preventDefault();});
 document.addEventListener('drop',safe(async ev=>{const day=ev.target.closest('[data-date]');if(!day)return;ev.preventDefault();const fid=ev.dataTransfer.getData('text/plain');if(!S.doc.fichas.some(f=>f.id===fid))return;await commit('Programar publicación',doc=>doc.fichas.find(f=>f.id===fid).scheduledDate=day.dataset.date);}));
 function updateClock(){if(!f()||!$('#clock'))return;$('#clock').textContent=V.fmt(S.time);const px=Number($('.timeline')?.dataset.px)||1;if($('#playhead'))$('#playhead').style.left=116+S.time*px+'px';const active=D.active(f(),S.route,S.time);const ids=new Set(active.map(b=>b.id));document.querySelectorAll('.block').forEach(el=>el.classList.toggle('now',ids.has(el.dataset.block)));if($('#now-active'))$('#now-active').innerHTML=active.filter(x=>x.laneId!=='story').slice(0,8).map(x=>`<button data-block="${V.esc(x.id)}">${V.esc(x.laneId)} · ${V.esc(x.label)}</button>`).join('');}
 let last=0;function tick(now){if(S.playing&&f()){if(last)S.time+=(now-last)/1000;if(S.time>=D.duration(f(),S.route)){S.time=D.duration(f(),S.route);S.playing=false;}updateClock();}last=now;requestAnimationFrame(tick);}requestAnimationFrame(tick);
 document.addEventListener('visibilitychange',()=>{S.playing=false;last=0;});
 window.addEventListener('beforeunload',ev=>{if(S.formDirty||S.busy){ev.preventDefault();ev.returnValue='';}});
 let timer;window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(()=>{if(!S.formDirty&&!drag)render();},200);});
 // Shell upgrades do not replace local project data. Embedded updated projects are adopted only explicitly.
 const embedded=$('#canvastect-data');
 try{if(embedded?.textContent.trim()){const doc=D.normalize(JSON.parse(embedded.textContent));const local=await DB.get(doc.projectId);if(local&&JSON.stringify(local)!==JSON.stringify(doc)){S.doc=local;S.fid=local.fichas[0]?.id;S.pendingImport=doc;render();show(`<h2>Hay una versión local de este proyecto</h2><p>El archivo abierto contiene otra revisión. Puedes conservar la local o adoptar la del archivo guardando primero la anterior en Historial.</p><div class="actions">${V.btn('close','Continuar versión local')}${V.btn('accept-import','Usar archivo y conservar historial','primary')}</div>`);}else await adopt(doc,'Abrir lienzo');}else{let last;try{last=localStorage.getItem('canvastect-last');}catch{}if(last)S.doc=await DB.get(last);render();}}catch(e){render();toast('No se pudo abrir/guardar: '+e.message);}
 // Register only on hosted creator; portable exported HTML never assumes sibling service-worker files.
 if(document.querySelector('meta[name="canvastect-hosted"]')&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('./sw.js').then(reg=>{const offer=()=>{if(reg.waiting)toast('Nueva versión del creador disponible. Recarga después de guardar.');};offer();reg.addEventListener('updatefound',()=>reg.installing?.addEventListener('statechange',offer));}).catch(()=>{});
 }
 // Read-only testing/debug surface; contains no publishing credentials.
 window.CanvastectApp={getDocument:()=>D.clone(S.doc),getState:()=>({fid:S.fid,bid:S.bid,route:S.route}),render};
})();
</script></body></html>
